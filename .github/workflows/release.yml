name: Release Bedrock Pack

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable annotated tag, for example v1.0.0'
        required: true
        type: string
      confirm_release:
        description: 'Type create-immutable-release after separate release authority is granted.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: minecraft-bedrock-c418-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    if: inputs.confirm_release == 'create-immutable-release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.assert-tag.outputs.tag }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - id: assert-tag
        name: Verify immutable tag and manifest version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "${RELEASE_TAG}" = "v$(python3 -c 'import json; print(".".join(map(str, json.load(open("mod/manifest.json"))["header"]["version"])))')"
          git tag --points-at HEAD | grep -Fx -- "${RELEASE_TAG}"
          test "$(git cat-file -t "${RELEASE_TAG}")" = tag
          printf 'tag=%s\n' "${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Validate and package deterministic assets
        run: |
          set -euo pipefail
          bash scripts/validate.sh
          mkdir release-assets
          bash scripts/package.sh
          cp dist/*.mcpack dist/SHA256SUMS.txt release-assets/

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ inputs.tag }}-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.package.outputs.tag }}-${{ github.sha }}
          path: release-assets

      - name: Create release without replacing prior assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to modify existing release $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
