name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: minecraft-bedrock-c418-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ ((github.event_name != 'pull_request') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner && github.actor == github.repository_owner)) && fromJSON('["self-hosted", "Linux", "X64", "docker"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate repository
        run: bash scripts/validate.sh

      - name: Package mod artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          bash scripts/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minecraft-bedrock-c418-mcpack-${{ github.sha }}
          path: |
            dist/*.mcpack
            dist/SHA256SUMS.txt
          if-no-files-found: error
